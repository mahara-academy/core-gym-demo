<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم | كور جيم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"><link rel="stylesheet" href="/style.css"></head>
<body><div class="demo">لوحة تحكم تجريبية، كلمة السر التجريبية: admin123</div>
<header class="top"><div class="wrap"><a class="logo" href="/">كور<b>.</b>جيم</a><a href="/" style="color:var(--mut)">رجوع للموقع</a></div></header>
<main class="wrap admin" style="padding-bottom:60px">
<div id="login" style="max-width:340px;padding-top:30px"><h2>تسجيل الدخول</h2><input id="pw" type="password" placeholder="كلمة السر" dir="ltr"><div class="msg" id="lmsg"></div><button class="btn" id="go" style="width:100%">دخول</button></div>
<div id="app" style="display:none">
<div class="cards"><div class="stat"><b id="stM">0</b>أعضاء</div><div class="stat"><b id="stB">0</b>حجوزات سارية</div><div class="stat"><b id="stR">0</b>إيرادات الاشتراكات</div></div>
<h2>الحصص والسعة</h2><div class="scroll"><table><thead><tr><th>الحصة</th><th>اليوم</th><th>محجوز</th><th>السعة</th><th></th></tr></thead><tbody id="cl"></tbody></table></div>
<h3 style="margin-top:20px">إضافة حصة</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px">
<input id="nn" placeholder="اسم الحصة"><input id="nt" placeholder="المدرب"><select id="nd"></select><input id="ntm" type="time" dir="ltr" value="18:00"><input id="nc" type="number" placeholder="السعة" dir="ltr" value="15"><select id="ni"><option value="cross">كروس فيت</option><option value="boxing">بوكسينج</option><option value="yoga">يوجا</option><option value="spin">سبينج</option><option value="core">كور</option><option value="kettle">كيتل بيل</option></select></div>
<div class="msg" id="amsg"></div><button class="btn" id="add">إضافة</button>
<h2>أسعار الباقات</h2><div class="scroll"><table><tbody id="pl"></tbody></table></div>
<h2>الأعضاء</h2><div class="scroll"><table><thead><tr><th>الكود</th><th>الاسم</th><th>الباقة</th><th>لحد</th></tr></thead><tbody id="mem"></tbody></table></div>
<h2>آخر الحجوزات</h2><div class="scroll"><table><thead><tr><th>العضو</th><th>الحصة</th><th>التاريخ</th><th>الحالة</th></tr></thead><tbody id="bk"></tbody></table></div>
</div></main><div class="toast" id="toast"></div><script src="/admin.js"></script></body></html>
